<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DocTabs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap">

</head>
<body>
<div id="root" class="tt-demo"></div>
<script>
var T = window.TTool, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { border: '1px solid var(--line)', borderRadius: 6, overflow: 'hidden' } },
  h(T.DocTabs, { defaultTabs: [
      { id: 'a', title: '林晚', type: '角色' },
      { id: 'b', title: '沈既白', type: '角色', dirty: true },
      { id: 'c', title: '灯塔会', type: '势力' },
      { id: 'd', title: '潮汐历法', type: '世界观' },
      { id: 'e', title: '第一幕 · 失踪的灯守', type: '剧情' }],
    defaultActiveId: 'b', onAdd: function () {} }),
  h('div', { style: { height: 12, background: 'var(--surface)' } })));
</script>
</body>
</html>
