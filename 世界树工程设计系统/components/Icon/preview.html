<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Icon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap">

</head>
<body>
<div id="root" class="tt-demo"></div>
<script>
var T = window.TTool, h = React.createElement;
var cap = { plus:'新建', close:'关闭', undo:'撤销', history:'历史快照', snapshot:'存快照', connect:'连线', note:'便签', paperclip:'档案引用', fit:'适应', 'zoom-in':'放大', 'zoom-out':'缩小', save:'保存', 'export':'导出', 'import':'导入', canvas:'关系画布', preset:'预设', folder:'分组', archive:'档案', tag:'标签', edit:'重命名', trash:'删除', child:'子级', sibling:'同级', swap:'调转', 'mod-text':'文本', 'mod-number':'数值', 'mod-axis':'倾向轴', 'mod-radar':'雷达图', 'mod-bool':'是/否', grip:'拖动', search:'搜索', warn:'提醒', info:'说明', jump:'跳转' };
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(76px, 1fr))', gap: 4 } },
    Object.keys(cap).map(function (n) {
      return h('div', { key: n, style: { display:'flex', flexDirection:'column', alignItems:'center', gap: 4, padding: '8px 2px', color: 'var(--ink)' } },
        h(T.Icon, { name: n, size: 20 }), h('span', { className: 'tt-demo-cap' }, cap[n]));
    })));
</script>
</body>
</html>
